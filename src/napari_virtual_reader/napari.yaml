name: napari-virtual-reader
display_name: napari-virtual-reader
schema_version: 0.2.1
contributions:
  commands:
    - id: napari-virtual-reader.get_reader
      python_name: napari_virtual_reader._reader:napari_get_reader
      title: Open as virtual OME-Zarr
    - id: napari-virtual-reader.widget
      python_name: napari_virtual_reader._widget:VirtualReaderWidget
      title: Open virtual OME-Zarr
  readers:
    - command: napari-virtual-reader.get_reader
      accepts_directories: false
      filename_patterns:
        - '*.[cC][zZ][iI]'
        - '*.[tT][iI][fF]'
        - '*.[tT][iI][fF][fF]'
        - '*.[sS][vV][sS]'
        - '*.[nN][dD][pP][iI]'
        - '*.[nN][dD]2'
        - '*.[lL][iI][fF]'
        - '*.[iI][mM][sS]'
        - '*.[vV][sS][iI]'
        - '*.[qQ][pP][tT][iI][fF][fF]'
        - '*.[dD][cC][mM]'
        - '*.[dD][iI][cC][oO][mM]'
        - '*.[nN][iI][iI]'
        - '*.[nN][iI][iI].[gG][zZ]'
        - '*.[nN][rR][rR][dD]'
        - '*.[nN][hH][dD][rR]'
        - '*.[mM][rR][cC]'
        - '*.[mM][aA][pP]'
        - '*.[vV][zZ][iI][pP]'
  widgets:
    - command: napari-virtual-reader.widget
      display_name: Open Data as virtual OME-ZARR