[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "napari-refkv"
version = "0.1.0"
description = "Open refkv-supported images as lazy virtual OME-Zarr in napari"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "napari>=0.6",
    "refkv[zarr,images]>=0.2.0",
    "zarr>=3.4",
    "dask[array]>=2024.1",
    "numpy>=2",
    "qtpy>=2.4",
    "superqt>=0.7",
]

[project.optional-dependencies]
testing = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9", "tifffile"]

[project.entry-points."napari.manifest"]
napari-refkv = "napari_refkv:napari.yaml"

[tool.hatch.build.targets.wheel]
packages = ["src/napari_refkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]